[package]
name = "print-util"
version = "0.3.0"
edition = "2021"
description = "Silent local print server – accepts a PDF via HTTP multipart and prints without any dialog"

[[bin]]
name = "print-util"
path = "src/main.rs"

[[bin]]
name = "print-util-tray"
path = "src/tray_main.rs"

[dependencies]
axum            = { version = "0.8.9", features = ["multipart"] }
tokio           = { version = "1.52.1",   features = ["full"] }
serde           = { version = "1",   features = ["derive"] }
serde_json      = "1"
anyhow          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2.5"
uuid            = { version = "1.23.1", features = ["v4"] }
thiserror       = "2.0.18"
regex           = "1"
once_cell       = "1"
memmap2         = "0.9"
sha2            = "0.11.0"
num_cpus        = "1"
hound           = "3.5"
symphonia       = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm"] }
llama-cpp-2     = "0.1.144"
ort             = { version = "2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "ndarray", "api-24", "tracing"] }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
] }
libloading     = "0.8"
windows-service = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
